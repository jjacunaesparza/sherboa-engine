name: sherboa CI/CD

on:
    push:
      branches:
          - main


permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sherboa-engine:ci .

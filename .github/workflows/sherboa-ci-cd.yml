name: sherboa CI/CD

on:
    push:
      branches:
          - main


permissions:
  id-token: write
  contents: read


jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Debug OIDC subject
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC sub:', payload.sub);
            console.log('OIDC aud:', payload.aud);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::557643338880:role/SherboaGitHubActionsRole
          aws-region: us-east-1

      - name: Build Docker image
        run: docker build -t sherboa-engine:ci .

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine
          docker build -t $IMAGE_URI:${{ github.sha }} .
          docker push $IMAGE_URI:${{ github.sha }}
      
      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_URI=557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine
          IMAGE_TAG=${{ github.sha }}

          aws ssm send-command \
            --instance-ids i-082236ea5c1088e9f \
            --document-name AWS-RunShellScript \
            --comment "Deploy Sherboa ${IMAGE_TAG}" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${IMAGE_URI}\",
              \"docker pull ${IMAGE_URI}:${IMAGE_TAG}\",
              \"docker rm -f sherboa-engine 2>/dev/null || true\",
              \"docker run -d --name sherboa-engine --restart unless-stopped -p 8000:8000 ${IMAGE_URI}:${IMAGE_TAG}\",
              \"curl -f http://localhost:8000/\"
            ]}"
